<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>1999 Birthday Quiz</title>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon-green: #00ff9c;
      --neon-pink: #ff2fdc;
      --neon-blue: #00cfff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: black;
      color: var(--neon-green);
      font-family: 'VT323', monospace;
      overflow-x: hidden;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      z-index: 9999;
    }

    .loader-box {
      border: 2px solid var(--neon-green);
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 20px var(--neon-green);
    }

    .boot {
      font-family: 'Press Start 2P', cursive;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    .correct-bubble {
      position: fixed;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      background: black;
      border: 2px solid var(--neon-green);
      padding: 16px 24px;
      color: var(--neon-green);
      font-size: 1.5rem;
      box-shadow: 0 0 25px var(--neon-green);
      animation: matrixPop 0.8s ease;
      z-index: 999;
    }

    .wrong-bubble {
      position: fixed;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      background: black;
      border: 2px solid red;
      padding: 16px 24px;
      color: red;
      font-size: 1.4rem;
      box-shadow: 0 0 20px red;
      animation: matrixPop 0.8s ease;
      z-index: 999;
    }

    @keyframes matrixPop {
      0% { opacity: 0; transform: translate(-50%,20px); }
      40% { opacity: 1; transform: translate(-50%,0); }
      100% { opacity: 0; }
    }

    .wrong { animation: redGlitch 0.6s ease; }

    @keyframes redGlitch {
      0% { background: black; }
      30% { background: red; color: white; transform: translateX(-6px); }
      60% { background: black; transform: translateX(6px); }
      100% { background: black; }
    }

    canvas#matrix {
      position: fixed;
      inset: 0;
      z-index: -1;
    }

    header {
      text-align: center;
      padding: 20px 12px;
    }

    header h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.1rem;
      color: var(--neon-pink);
      text-shadow: 0 0 10px var(--neon-pink);
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      background: rgba(0,0,0,0.65);
      border: 2px solid var(--neon-green);
      box-shadow: 0 0 20px var(--neon-green);
    }

    #progress {
      margin-bottom: 12px;
      font-size: 1.1rem;
      color: var(--neon-pink);
    }

    .question {
      font-size: 1.6rem;
      margin-bottom: 20px;
    }

    .answers button,
    .restart {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      font-size: 1.2rem;
      background: black;
      color: var(--neon-blue);
      border: 2px solid var(--neon-blue);
      cursor: pointer;
    }

    .hidden { display: none; }

    #final {
      text-align: center;
      padding: 24px 12px;
    }

    .final-glitch {
      animation: finalGlitch 1s ease;
    }

    @keyframes finalGlitch {
      0% { transform: scale(1); filter: blur(0); }
      30% { transform: scale(1.05) skewX(5deg); filter: blur(2px); }
      60% { transform: scale(0.98) skewX(-5deg); filter: blur(1px); }
      100% { transform: scale(1); filter: blur(0); }
    }

    #score { font-size: 3rem; }
    #rating { font-size: 2rem; margin-top: 12px; }
  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<header>
  <h1>🎂 1999.EXE_The Marghempft Protocol 🎂</h1>
</header>

<div id="loader">
  <div class="loader-box">
    <p class="boot">INITIALISING 1999.EXE</p>
  </div>
</div>

<main>
  <section id="quiz">
    <div id="progress"></div>
    <div class="question" id="questionText"></div>
    <div class="answers" id="answers"></div>
  </section>

  <section id="final" class="hidden">
        <h2>🎯 FINAL SCORE 🎯</h2>
    <div id="score"></div>
    <div id="rating"></div>
    <button class="restart" onclick="restartQuiz()">🔁 Restart Quiz</button>
  </section>
</main>

<script>
// QUESTIONS
const questions = [
  { question: "On which day was Margherita born?", answers: ["16 January 1999","18 January 1998","26 January 1997","In the Institute of Natural Sciences in Brussels she is listed as a fossil"], correct: 0 },
  { question: "The day Margherita was born, her father was supposed to travel to watch a football match. At the end of the season, her favourite club won the Serie A for the second time in history. Which match was it?", answers: ["Lazio - Roma","Parma - Lazio","Manchester United - Barcelona","I see why she is obsessed with football now"], correct: 1 },
  { question: "The day Margherita was born, her mother had a medical appointment while not realising she was already in labor. How many medical interns were there when Margherita was then born?", answers: ["Only one","Six","Too many to remember","Is this a Grey's Anatomy episode?"], correct: 1 },
  { question: "In 1999, the €uro  was introduced in the European Union. Margherita knows (or pretends to) many European languages. Which one does she not know the grammar of:", answers: ["Greek","Portuguese","Dutch","No, French is not an option for this question"], correct: 1 },
  { question: "In 1999, the U.S. women's national soccer team won the World Cup. Margherita loves football but used to play many other sports in her teenage years (crazy to think about now, I know...). Which one has she never tried?", answers: ["High jump","Tennis","Alpine ski","Can she even do a push-up now?"], correct: 2 },
  { question: "1999 was ehm a very eventful year for international politics. In Italy, the president was Scalfaro and then Ciampi, but who was the prime minister when Margherita was born:", answers: ["Massimo D'Alema","Silvio Berlusconi","Pippo Baudo","No idea, all men look the same to me"], correct: 0 },
  { question: "In 1999, the console Sega Dreamcast was launched in Europe and the PlayStation 2 was announced by Sony. Which is Margherita's favourite video game?", answers: ["Pokemon Emerald","Dark Souls II","Shadow of the Colossus","I only know she sucks at Mario Kart"], correct: 2 },
  { question: "In 1999, one of Margherita's favourite films was released: Matrix, by the Wachowski sisters. Which (adapted) quote from the film does Margherita repeat often:", answers: ["I used to eat there. Really good noodles.","There is no spoon.","I'm trying to free your mind, Neo. But I can only show you the door. You're the one that has to walk through it.","[I don't believe in fate] because I don't like the idea that I'm not in control of my life."], correct: 3 },
  { question: "Many other great films were released in 1999. All of the following movies have been in Margherita's top 4 list on Letterboxd, but which one is visible on her profile now?", answers: ["Dirty Dancing, Portrait de la jeune fille en feu, In the Mood for Love, Frances Ha","Matrix, Casablanca, Hannah Gadsby: Nanette, Persona","Blade Runnner, Non essere cattivo, The Handmaiden, Paddington","The Lobster, Aftersun, Persepolis, Cléo de 5 à 7"], correct: 0 },
  { question: "In 1999, the punk-rock band Blink-182 released the album Enema of the State, one of Margherita's favourite albums ever. According to her 2025 Spotify Wrapped, which is Margherita's most listened song in 2025?", answers: ["What was that - Lorde","Whatever was going on between the kitchen and the first floor of this house","Hangover - Taio Cruz, Flo Rida","From punk at 16 to pop at 26? Aging is so bad, girl"], correct: 0 }
];

// STATE
let current = 0;
let score = 0;

const questionText = document.getElementById('questionText');
const answersDiv = document.getElementById('answers');
const quizSection = document.getElementById('quiz');
const finalSection = document.getElementById('final');
const scoreEl = document.getElementById('score');
const ratingEl = document.getElementById('rating');

function shuffle(arr) {
  return arr.map(v => ({ v, r: Math.random() }))
            .sort((a,b) => a.r - b.r)
            .map(o => o.v);
}

function loadQuestion() {
  const q = questions[current];
  questionText.textContent = q.question;
  document.getElementById('progress').textContent = `QUESTION ${current + 1} / ${questions.length}`;
  answersDiv.innerHTML = '';

  shuffle(q.answers.map((a,i) => ({ a,i }))).forEach(item => {
    const btn = document.createElement('button');
    btn.textContent = item.a;
    btn.onclick = () => selectAnswer(item.i);
    answersDiv.appendChild(btn);
  });
}

function selectAnswer(index) {
  if (index === questions[current].correct) {
    score++;
    showBubble('✔ MEMORY UNLOCKED','correct-bubble');
  } else {
    document.body.classList.add('wrong');
    showBubble('✖ ACCESS DENIED','wrong-bubble');
  }

  setTimeout(() => {
  document.body.classList.remove('wrong');

  const transitionType =
    index === questions[current].correct ? 'correct' : 'wrong';

  showTransition(transitionType, () => {
    current++;
    current < questions.length ? loadQuestion() : showFinal();
  });

}, 700);

}

function showBubble(text, cls) {
  const bubble = document.createElement('div');
  bubble.className = cls;
  bubble.textContent = text;
  document.body.appendChild(bubble);
  setTimeout(() => bubble.remove(), 900);
}
  function showTransition(type, callback) {
  const overlay = document.createElement('div');
  overlay.className = 'transition';

  let text;

  if (type === 'correct') {
    text = `> loading_memory_fragment_${Math.floor(Math.random() * 90 + 10)}...\n> decoding_1999.exe...`;
  } else {
    // rare creepy message (~15%)
    const rare = Math.random() < 0.15;

    text = rare
      ? `> DATA CORRUPTION DETECTED\n> UNKNOWN VARIABLE: YOU`
      : `> DATA CORRUPTION DETECTED\n> RECOVERING CORRUPTED DATA...`;
  }

  overlay.innerHTML = `
    <div class="transition-box">
      ${text.replace(/\n/g, '<br>')}
    </div>
  `;

  document.body.appendChild(overlay);

  setTimeout(() => {
    overlay.remove();
    callback();
  }, 450);
}


function showFinal() {
  quizSection.classList.add('hidden');
  finalSection.classList.remove('hidden');
  finalSection.classList.add('final-glitch');
  scoreEl.textContent = `${score} / ${questions.length}`;

  const p = score / questions.length;
  ratingEl.textContent = p === 1
    ? '💾 MARGHERITA LORE MASTER 💾'
    : p > 0.7
    ? '📼 I can tell you were born in the 90s'
    : p > 0.4
    ? '🕶️ Casual Matrix observer'
    : '🧨 FATAL ERROR, MEMORY LOST';
}

function restartQuiz() {
  current = 0;
  score = 0;
  finalSection.classList.add('hidden');
  quizSection.classList.remove('hidden');
  loadQuestion();
}


// LOADER
setTimeout(() => {
  document.getElementById('loader').style.display = 'none';
  loadQuestion();
}, 1800);

// MATRIX BACKGROUND
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const letters = '1999BIRTHDAYQUIZ01'.split('');
const fontSize = 14;
const columns = Math.floor(canvas.width / fontSize);
const drops = Array(columns).fill(1);

function drawMatrix() {
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#00ff9c';
  ctx.font = fontSize + 'px monospace';

  drops.forEach((y,i) => {
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, y*fontSize);
    if (y*fontSize > canvas.height && Math.random()>0.98) drops[i]=0;
    drops[i]++;
  });
}

setInterval(drawMatrix, 33);
</script>

</body>
</html>
