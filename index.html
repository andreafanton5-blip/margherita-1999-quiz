<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>1999 Birthday Quiz</title>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon-green: #00ff9c;
      --neon-pink: #ff2fdc;
      --neon-blue: #00cfff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: black;
      color: var(--neon-green);
      font-family: 'VT323', monospace;
      overflow-x: hidden;
    }

    /* LOADER */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      z-index: 9999;
    }

    .loader-box {
      border: 2px solid var(--neon-green);
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 20px var(--neon-green);
    }

    .boot {
      font-family: 'Press Start 2P', cursive;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    /* FEEDBACK */
    .correct { animation: greenFlash 0.4s ease; }
    .wrong { animation: redGlitch 0.4s ease; }

    @keyframes greenFlash {
      0% { background: black; }
      50% { background: var(--neon-green); color: black; }
      100% { background: black; }
    }

    @keyframes redGlitch {
      0% { background: black; }
      30% { background: red; color: white; transform: translateX(-4px); }
      60% { background: black; transform: translateX(4px); }
      100% { background: black; }
    }

    canvas#matrix {
      position: fixed;
      inset: 0;
      z-index: -1;
    }

    header {
      text-align: center;
      padding: 20px 12px;
    }

    header h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.1rem;
      color: var(--neon-pink);
      text-shadow: 0 0 10px var(--neon-pink);
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      background: rgba(0,0,0,0.65);
      border: 2px solid var(--neon-green);
      box-shadow: 0 0 20px var(--neon-green);
    }

    .question {
      font-size: 1.6rem;
      margin-bottom: 20px;
    }

    .answers button,
    .restart {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      font-size: 1.2rem;
      background: black;
      color: var(--neon-blue);
      border: 2px solid var(--neon-blue);
      cursor: pointer;
    }

    .answers button:active {
      transform: scale(0.97);
    }

    .hidden { display: none; }

    #final {
      text-align: center;
      padding: 24px 12px;
    }

    #score { font-size: 3rem; }
    #rating { font-size: 2rem; margin-top: 12px; }

    .fade {
      animation: fade 0.4s ease;
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<header>
  <h1>🎂 1999 BIRTHDAY QUIZ 🎂</h1>
</header>

<div id="loader">
  <div class="loader-box">
    <p class="boot">INITIALISING 1999.EXE</p>
  </div>
</div>

<main class="fade">
  <section id="quiz">
    <div class="question" id="questionText"></div>
    <div class="answers" id="answers"></div>
  </section>

  <section id="final" class="hidden">
    <h2>🎯 FINAL SCORE 🎯</h2>
    <div id="score"></div>
    <div id="rating"></div>
    <button class="restart" onclick="restartQuiz()">🔁 Restart Quiz</button>
  </section>
</main>

<script>
  const questions = [
    {
      question: "The day Margherita was born, her father was supposed to go watch a football match. That year, her favourite club won the Serie A for the second time in history. Which match was it?",
      answers: ["Lazio - Roma","Parma - Lazio","Manchester United - Barcelona","I see why you are obsessed with football now"],
      correct: 1
    },
    {
      question: "The day Margherita was born, her mother had a medical appointment while not realising she was already in labor. How many medical interns were there when Margherita was then born?",
      answers: ["only one","seven","Too many to remember","What in the name of Grey's Anatomy is going on"],
      correct: 1
    },
    {
      question: "Margherita knows (or pretends to) many languages. Which one does she not know the grammar of:",
      answers: ["Greek","Portuguese","Dutch","Let me see who's the bitch who dares to answer French"],
      correct: 1
    },
    {
      question: "Margherita used to do many sports in her teenage years (crazy to think right now I know...). Which one has she never tried?",
      answers: ["High jump","Handball","Alpine ski","Ultimate frisbee"],
      correct: 2
    },
    {
      question: "1999 was ehm a very eventful year for international politics. Who was the prime minister in Italy when Margherita was born:",
      answers: ["Massimo D'Alema","Silvio Berlusconi","Pippo Baudo","Gerry Scotti"],
      correct: 0
    },
    {
      question: "In 1999, the PlayStation 2 was launched by Sony. Which is Margherita's favourite video game?",
      answers: ["Pokemon Emerald","Dark Souls II","Shadow of the Colossus","I only know she sucks at Super Mario Kart"],
      correct: 2
    },
    {
      question: "In 1999, one of Margherita's favourite films was released: Matrix, by the Wachowski sisters. Which quote from the film did Margherita steal and often adapt:",
      answers: ["I used to eat there. Really good noodles","There is no spoon.","I'm trying to free your mind, Neo. But I can only show you the door. You're the one that has to walk through it.","[I don't believe in fate] because I don't like the idea that I'm not in control of my life."],
      correct: 3
    },
    {
      question: "Plenty of great films were released in 1999. All of the following films have been in her top 4 list on Letterboxd, but which one is she using now?",
      answers: ["Frances Ha, Dirty Dancing, Portrait of a Lady on Fire, In the mood for love","Matrix, Casablanca, Hannah Gadsby: Nanette, Persona","Blade Runnner, Non essere cattivo, The Handmaiden, Paddington","The Lobster, Aftersun, Persepolis, Cléo de 5 à 7"],
      correct: 0
    }
  ];

  let current = 0;
  let score = 0;

  const questionText = document.getElementById('questionText');
  const answersDiv = document.getElementById('answers');
  const quizSection = document.getElementById('quiz');
  const finalSection = document.getElementById('final');
  const scoreEl = document.getElementById('score');
  const ratingEl = document.getElementById('rating');

  function shuffle(arr) {
    return arr.map(v => ({ v, r: Math.random() }))
      .sort((a,b) => a.r - b.r)
      .map(o => o.v);
  }

  function loadQuestion() {
    const q = questions[current];
    questionText.textContent = q.question;
    answersDiv.innerHTML = '';

    shuffle(q.answers.map((a,i) => ({ a,i }))).forEach(item => {
      const btn = document.createElement('button');
      btn.textContent = item.a;
      btn.onclick = () => selectAnswer(item.i);
      answersDiv.appendChild(btn);
    });
  }

  function selectAnswer(index) {
    if (index === questions[current].correct) {
      score++;
      document.body.classList.add('correct');
    } else {
      document.body.classList.add('wrong');
    }

    setTimeout(() => {
      document.body.classList.remove('correct','wrong');
      current++;
      if (current < questions.length) loadQuestion();
      else showFinal();
    }, 600);
  }

  function showFinal() {
    quizSection.classList.add('hidden');
    finalSection.classList.remove('hidden');
    scoreEl.textContent = `${score} / ${questions.length}`;

    const p = score / questions.length;
    ratingEl.textContent = p === 1 ? '💾 MARGHERITA LORE MASTER' 💾' : p > 0.7 ? '📼  I can tell you were born in the 90s' : p > 0.4 ? '🕶️ Bene ma non benissimo' : '👶 Born after 2000, try again';
  }

  function restartQuiz() {
    current = 0;
    score = 0;
    finalSection.classList.add('hidden');
    quizSection.classList.remove('hidden');
    loadQuestion();
  }

  setTimeout(() => {
    document.getElementById('loader').style.display = 'none';
    loadQuestion();
  }, 1800);

  /* MATRIX */
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const letters = '1999BIRTHDAYQUIZ01'.split('');
  const fontSize = 14;
  const columns = Math.floor(canvas.width / fontSize);
  const drops = Array(columns).fill(1);

  function drawMatrix() {
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#00ff9c';
    ctx.font = fontSize + 'px monospace';

    drops.forEach((y,i) => {
      const text = letters[Math.floor(Math.random()*letters.length)];
      ctx.fillText(text, i*fontSize, y*fontSize);
      if (y*fontSize > canvas.height && Math.random()>0.98) drops[i]=0;
      drops[i]++;
    });
  }

  setInterval(drawMatrix, 33);
</script>

</body>
</html>
